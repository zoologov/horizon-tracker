version: 3

# Constraints on the graph. A node's layer is declared on the node itself
# (`tags: [layer-...]` in horizon-tracker.yml); this file only says which
# directions are legal.

rules:
  - name: domain-needs-parent
    description: "Every domain must be part_of the horizon-tracker service"
    require:
      for: { kind: domain }
      has_edge_to: { ref_id: horizon-tracker }
      edge_kind: part_of

  - name: feature-needs-domain
    description: "Every feature must be part_of a domain"
    require:
      for: { kind: feature }
      has_edge_to: { kind: domain }
      edge_kind: part_of

  # The six external systems of landscape.yml are `service` nodes with
  # `lifecycle: external`, and this rule ignores lifecycle. They are excluded because
  # they are not part of horizon-tracker: a `part_of` edge would claim the service owns
  # the Horizon portal, isdayoff.ru, the Bot API, the owner's chat, the host and the
  # GitHub Environment. Their bindings are the produces/consumes edges there.
  - name: service-needs-parent
    description: "Every service (except the root and the external systems of landscape.yml) must be part_of the horizon-tracker service"
    require:
      for:
        kind: service
        exclude:
          - horizon-tracker
          - horizon-portal
          - isdayoff
          - telegram-bot-api
          - owner-chat
          - vps-host
          - github-environment
      has_edge_to: { ref_id: horizon-tracker }
      edge_kind: part_of

  - name: no-dependency-cycles
    description: "No circular depends_on chains"
    severity: error
    forbid_cycles:
      edge_kind: depends_on

  - name: architecture-layers
    title: "Clean Architecture"
    description: "cli (composition root) → adapters → application → domain — never the reverse"
    severity: error
    layers:
      - name: services
        tag: layer-service
      - name: adapters
        tag: layer-infra
      - name: application
        tag: layer-application
      - name: domain
        tag: layer-domain
    enforce: top-down
    allow_skip: true
    edge_kind: depends_on

  - name: scenario-coverage
    description: "Every layer with behaviour is pinned by a scenario, and every scenario a PRD names exists in the suite"
    severity: error
    scenario_coverage:
      for: { tag_prefix: "layer-" }
      features: "tests/acceptance/features/**/*.feature"
      references:
        - ".claude/development/docs/features/**/PRD.md"
      non_behavioural:
        - node: horizon-tracker
          reason: "the root service owns no code beyond its four layers; their scenarios pin its behaviour"
