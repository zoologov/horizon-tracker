# Features of the `application` layer: the shared run loop, the two daily use
# cases, the checks that run without logging in, and the bot's absence commands.
#
# Layer tags stay on the layer node; see domain-features.yml.
nodes:
  - ref_id: windowed-run
    kind: feature
    summary: "The run loop both use cases share: skips a day an absence covers before asking the calendar, asks the calendar once, decides each attempt, retries failures inside the window, builds exactly one report and sends it unless it is a day-level skip of a run that keeps those silent (the evening)"
    source: src/horizon_tracker/application/windowed_run.py
    docs:
      - docs/domains/application/features/windowed-run/SPEC.md

  - ref_id: morning-checkin
    kind: feature
    summary: "The morning check-in: open the desktop over Blast, hold it until Windows logs on, disconnect without logging off, confirm the session runs on"
    source: src/horizon_tracker/application/checkin.py
    docs:
      - docs/domains/application/features/morning-checkin/SPEC.md

  - ref_id: evening-checkout
    kind: feature
    summary: "The evening check-out: log the Windows session off from the tile menu and confirm it ended; a desktop with no session is reported as already logged off"
    source: src/horizon_tracker/application/checkout.py
    docs:
      - docs/domains/application/features/evening-checkout/SPEC.md

  - ref_id: probe
    kind: feature
    summary: "Checks without logging in: Probe asks the portal for its client bundles, the calendar for today and Chrome for its version; DryRun plans the run a use case would make"
    source: src/horizon_tracker/application/probe.py
    docs:
      - docs/domains/application/features/probe/SPEC.md

  - ref_id: absence-service
    kind: feature
    summary: "The owner's absences on command: add (refuses an overlap naming the absence in the way), list, delete (an id never reissued), edit (keeps the id); from the start of today's check-in range an absence covering today starts tomorrow; each answers with a Reply of catalogue messages"
    source: src/horizon_tracker/application/absence_service.py
    docs:
      - docs/domains/application/features/absence-service/SPEC.md

  - ref_id: bot-loop
    kind: feature
    summary: "Serves the owner's bot chat: polls, drops every other chat unread (its text never logged), parses, carries the command out, one reply per message; an internal error is answered and the loop goes on; backs off on a failed poll"
    source: src/horizon_tracker/application/bot_loop.py
    docs:
      - docs/domains/application/features/bot-loop/SPEC.md

edges:
  - { src: windowed-run,     dst: application, kind: part_of }
  - { src: morning-checkin,  dst: application, kind: part_of }
  - { src: evening-checkout, dst: application, kind: part_of }
  - { src: probe,            dst: application, kind: part_of }
  - { src: absence-service,  dst: application, kind: part_of }
  - { src: bot-loop,         dst: application, kind: part_of }
