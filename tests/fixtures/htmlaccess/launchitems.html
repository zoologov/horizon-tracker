     see app-htmlaccess.fixture.js) and the log-off confirmation the tile menu opens. -->
<div class="container">
  <ul class="ui-desktop-list" id="desktop-list"></ul>
</div>
<div id="logoffDialog" class="dialog" hidden>
  <p data-title="LOGOFF_DESKTOP_T">Log Off Desktop</p>
  <p data-message="dialog_confirm_logoff">Any unsaved data will be lost. Log off?</p>
  <button id="okDialogBtn" type="button">OK</button>
  <button id="cancelDialogBtn" type="button">Cancel</button>
</div>
