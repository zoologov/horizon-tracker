name: CI

# The completion checklist of CLAUDE.md, run on every pull request to main, on every push
# to main (a merge, checked once more on main; nothing here reaches the VPS), by hand, and -
# through workflow_call - as the gate a release waits for (release.yml). One workflow per
# event: a pull request starts this file and nothing else.
#
# Under workflow_call the caller names the commit to check (input `ref`): a redeploy by
# hand runs on main's head while it deploys an older tag, and the gate must check the
# commit that reaches the host. Every other event leaves `ref` empty, and checkout takes
# the event's own commit.
#
# Three stages, each started only when the one before it passed:
#   1. lint, types, workflow-lint - the static checks, a minute each; nothing else waits
#      on a browser or a suite to report a linter error.
#   2. tests (Python 3.12, the VPS, and 3.13, development) and beadloom-gate; on a pull
#      request also mutation-per-change, the mutation of the domain functions it touched.
#   3. ci-ok - the one status branch protection can require. It runs whatever the others
#      did (if: always()) and is red unless every job it needs succeeded: a failed,
#      cancelled or SKIPPED stage is red here, because a skipped required check would
#      read as passed. mutation-per-change is NOT among its needs: the mutation verdict is
#      informative (the owner's decision in HT-005), seen on the pull request, and a
#      skipped mutation job on a push or a release must not turn ci-ok red.
#
# Two meanings of "blocking", kept apart:
#  1. Inside a run: every step below fails its job. There is no continue-on-error and no
#     `|| true`; a step that must stay informational decides its own outcome and prints a
#     ::warning annotation instead, because continue-on-error turns a red step into a
#     `success` conclusion that no annotation reports (measured on a pull request of a
#     neighbouring project).
#  2. On a merge: whether ci-ok is REQUIRED is a branch-protection setting, which the
#     repository's administrator sets where the GitHub plan offers it. Without it a red
#     run is visible on the PR and does not stop a merge by itself.
#
# Every action is pinned to a full commit SHA, its version in the comment; Dependabot
# (.github/dependabot.yml) moves those pins and uv.lock. It does not move the two tools
# installed by version below - actionlint (go install ...@v1.7.12) and beadloom==9.0.0 -
# which move only by hand. tests/unit/deploy/ holds this file's contract.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "The commit to check; empty checks the caller's own commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # github.workflow names the CALLER under workflow_call, so the release's gate gets a group
  # of its own and never cancels, or is cancelled by, the CI run of the same push.
  # Only a pull request's superseded run is cancelled: a running CI on main is never
  # cancelled. A group holds at most one WAITING run whatever cancel-in-progress says, so of
  # several pushes to main queued behind a running one GitHub keeps the newest and drops
  # the older waiting run - not every commit on main gets a verdict of its own.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- stage 1 ------------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # No job pushes: the token is not left in .git/config for a later step to read.
          persist-credentials: false

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync deps
        # --extra dev: ruff, mypy and pytest live in [project.optional-dependencies].dev,
        # which a bare `uv sync` does not install. --locked: a uv.lock that disagrees with
        # pyproject.toml fails here, at the pull request, instead of re-resolving and
        # stopping the deploy, whose sync is --locked too. Every install in CI does the same.
        run: uv sync --locked --extra dev

      # No path on the command line: ruff takes the whole repository (src/, tests/ and the
      # CI glue in .github/scripts/), and a bare local run checks exactly what CI checks.
      - name: Ruff
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # No job pushes: the token is not left in .git/config for a later step to read.
          persist-credentials: false

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --locked --extra dev

      - name: Mypy
        # The scope is [tool.mypy] files in pyproject.toml: src/, the tests (a fixture typed
        # wrong is a test that checks something else) and .github/scripts/ (the adapter that
        # decides which mutants are counted). A path here would override it.
        run: uv run mypy

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # No job pushes: the token is not left in .git/config for a later step to read.
          persist-credentials: false

      - name: Install actionlint
        # A pinned version through the Go module proxy: the download is checked against
        # the checksum database, and no install script is piped into a shell.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint
        # Reads every workflow, and runs shellcheck (preinstalled on the runner) over
        # each run: script.
        run: actionlint

      - name: shellcheck
        run: shellcheck deploy/*.sh scripts/*.sh

      - name: "systemd: verify the units"
        # As tests/unit/deploy/test_units.py does: the CLI exists only on the VPS, so
        # ExecStart is pointed at a binary that exists here; everything else is the
        # shipped text. verify exits 0 on a value it only warns about ("Unknown key name
        # ..., ignoring"), so its output must be empty too.
        run: |
          set -euo pipefail
          units="$RUNNER_TEMP/units"
          rm -rf "$units"
          mkdir -p "$units"
          executable="$(command -v true)"
          for unit in deploy/*.service deploy/*.timer; do
            sed "s|/opt/horizon-tracker/.venv/bin/horizon|$executable|g" "$unit" \
              > "$units/$(basename "$unit")"
          done
          if ! output="$(systemd-analyze verify "$units"/* 2>&1)"; then
            printf '%s\n' "$output"
            exit 1
          fi
          if [ -n "$output" ]; then
            printf '%s\n' "$output"
            echo "::error title=systemd::systemd-analyze verify warned about the units"
            exit 1
          fi
          echo "verified: $(cd "$units" && echo *)"

  # --- stage 2 ------------------------------------------------------------------------------

  tests:
    needs: [lint, types, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      # Every leg reports: a red 3.13 must not hide what 3.12, the VPS, would have said.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # No job pushes: the token is not left in .git/config for a later step to read.
          persist-credentials: false

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync deps
        run: uv sync --locked --extra dev

      - name: Playwright version from uv.lock
        # The browser a Playwright release drives is fixed by that release, so the
        # locked version is the cache key: a bump in uv.lock downloads the new browser.
        id: playwright
        run: |
          set -euo pipefail
          version="$(awk '/^name = "playwright"$/ { found = 1; next }
                          found && /^version = / { gsub(/"/, "", $3); print $3; exit }' uv.lock)"
          if [ -z "$version" ]; then
            echo "::error title=uv.lock::no playwright package in uv.lock"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium for the adapters
        # tests/integration/infrastructure drives Playwright against the local HTML Access
        # fixture, never the portal. With the browser restored from the cache this only
        # installs the system libraries, which no cache carries.
        run: uv run playwright install --with-deps chromium

      - name: Pytest
        # -rs prints the reason of every skip, so a skipped check is read as skipped.
        # --cov makes pytest-cov evaluate [tool.coverage.report] fail_under: coverage below
        # the floor fails this step. Without it the floor is declared and never checked.
        run: uv run pytest -q -rs --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage in the job summary
        # The floor is the Pytest step's to judge. Here --fail-under=0 keeps `coverage
        # report` from exiting 2 under the floor, which under set -e would end the step
        # before the line is written - in the one run where the figure matters most.
        if: ${{ !cancelled() }}
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          set -euo pipefail
          if [ -f .coverage ]; then
            total="$(uv run coverage report --format=total --fail-under=0)"
            line="Coverage on Python $PYTHON: ${total}% (floor: fail_under in pyproject.toml)"
          else
            line="Coverage on Python $PYTHON: no data - pytest did not reach the end"
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep coverage.xml
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  beadloom-gate:
    needs: [lint, types, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # No job pushes: the token is not left in .git/config for a later step to read.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install beadloom
        # 9.0.0 pins tree-sitter itself; no workaround is needed.
        run: uv tool install beadloom==9.0.0

      - name: Beadloom Gate (clean index)
        # The index is removed and rebuilt from nothing: an incremental reindex does not
        # refresh import edges, and lint over a stale index reports a green it did not check.
        run: |
          rm -f .beadloom/beadloom.db
          beadloom reindex
          beadloom ci

      - name: Epics against the AS-IS space
        run: beadloom docs spaces --strict

  mutation-per-change:
    # Mutation testing of the domain functions this pull request touched - the scheme of
    # beadloom's own mutation.yml (BDL-074), adopted by owner decision in HT-005. The
    # declared scope is mutation.targets in .beadloom/flow.yml (src/horizon_tracker/domain/,
    # the same scope as [tool.mutmut] only_mutate); scripts/mutation.sh takes the population
    # from `beadloom mutation --changed-since`, runs mutmut over exactly that population and
    # has beadloom judge it against the 85 % floor. A pull request that touches no domain
    # function says so: the outcome is `nothing-to-mutate`, an annotation and a line in the
    # summary name it, and nothing is scored - a stated "no population", never a silent one.
    # A push and a release have no change to take a population from, so the job runs on a
    # pull request only. It is informative: ci-ok does not need it. The weekly sample of
    # the whole scope is mutation.yml. mutmut exits 0 when mutants survive, so its run needs
    # no excuse; the script exits with beadloom's verdict.
    if: github.event_name == 'pull_request'
    needs: [lint, types, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # beadloom takes the merge base of this ref and HEAD: the pull request's own change.
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The merge base needs the base branch's history, not a single commit.
          fetch-depth: 0
          # Nothing pushes, and the history is fetched here: no token stays in .git/config.
          persist-credentials: false

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install the suite and beadloom
        run: |
          uv sync --locked --extra dev
          uv tool install beadloom==9.0.0

      - name: Build the index the population is read from
        run: beadloom reindex

      - name: Mutate the changed domain functions
        run: |
          scripts/mutation.sh --changed-since "$BASE" --out "$RUNNER_TEMP/mutation" --min-score 85

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mutation"
          {
            echo "### Mutation per change"
            echo
            echo '```text'
            if [ -f "$out/report.md" ]; then cat "$out/report.md"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          outcome=""
          if [ -f "$out/outcome" ]; then outcome="$(cat "$out/outcome")"; fi
          case "$outcome" in
            nothing-to-mutate)
              echo "::notice title=Mutation::Nothing to mutate - the change touches no domain function that generates a mutant"
              echo "**Nothing to mutate**: no score, because there is no population." >> "$GITHUB_STEP_SUMMARY"
              ;;
            scored) ;;
            *)
              echo "**The run reached no verdict**: no outcome was written." >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Mutation::the run reached no verdict"
              exit 1
              ;;
          esac

      - name: Keep the plan, the counters and the survivors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-per-change-${{ github.run_id }}
          path: ${{ runner.temp }}/mutation
          if-no-files-found: ignore
          retention-days: 14

  # --- stage 3 ------------------------------------------------------------------------------

  ci-ok:
    needs: [lint, types, workflow-lint, tests, beadloom-gate]
    # always(): without it a failed need SKIPS this job, and a skipped required check is
    # read as passed by branch protection.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every stage succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          count="$(jq 'length' <<< "$NEEDS")"
          if [ "$count" -eq 0 ]; then
            echo "::error title=ci-ok::no job to sum - ci-ok checked nothing"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          failed="$(jq -r '[to_entries[] | select(.value.result != "success") | .key]
                           | join(", ")' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error title=ci-ok::did not succeed: $failed"
            exit 1
          fi
          echo "all $count jobs succeeded"
