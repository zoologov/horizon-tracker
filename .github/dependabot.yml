# Keeps the pins moving. The workflows pin every action to a commit SHA, which its owner
# cannot move and nothing else moves either; Dependabot opens the pull request that does,
# updating the SHA and its `# vX.Y.Z` comment together. uv.lock is watched the same way.
# Minor and patch bumps of an ecosystem arrive grouped as one pull request a week; a
# major bump arrives alone, because it is the one that can change behaviour.
# CI (ci-ok) is the check each of those pull requests is read by.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
