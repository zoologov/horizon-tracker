name: Bug report
description: The service, the horizon command or the deploy does something it should not.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not paste a password, a bot token, a chat id or an
        account name anywhere in this form; replace each with `<redacted>`. A security
        issue goes through the Security tab, not here (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `horizon --version`, or the commit the host runs.
      placeholder: horizon, version 1.0.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where the problem shows.
      options:
        - Morning check-in
        - Evening check-out
        - Working-day calendar
        - Drawn moments and timers
        - Telegram report
        - horizon probe or --dry-run
        - Deploy or release workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and when (the date and the time in the configured zone).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran, e.g. `horizon checkin --dry-run`.
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: >-
        The journal lines of the run (`journalctl -u horizon-checkin`), the output of
        `horizon probe` or the Telegram report text. Check that no credential is in them.
      render: text
  - type: input
    id: horizon-client
    attributes:
      label: Horizon HTML Access version
      description: The version the portal's web client shows, if you know it.
      placeholder: "2312.1"
