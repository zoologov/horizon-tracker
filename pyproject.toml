[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-tracker"
version = "0.1.0"
description = "Scheduled check-in/check-out of a VMware Horizon VDI session, run on a VPS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
horizon = "horizon_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_tracker"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
