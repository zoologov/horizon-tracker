[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-tracker"
version = "0.1.0"
description = "Scheduled check-in and check-out of a VMware Horizon VDI desktop at moments drawn inside configured ranges, reported to Telegram"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.0",
    "pyyaml>=6.0",
    "mutmut>=3.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
horizon = "horizon_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_tracker"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# What a bare `mypy` checks, and what CI's types job runs: the code, the tests and the CI
# glue that decides which mutants are counted.
files = ["src", "tests", ".github/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
bdd_features_base_dir = "tests/acceptance/features/"

[tool.coverage.run]
source = ["horizon_tracker"]
branch = true
# Playwright's sync API runs on greenlets; tracing only threads counts the lines the
# browser adapter executes as missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mutmut]
# The mutation gate covers the pure domain only: no I/O, no clock, no browser, so a
# surviving mutant is a weak assertion and not an unreachable adapter branch.
source_paths = ["src/"]
only_mutate = ["src/horizon_tracker/domain/*"]
# The fast suites that reach the domain; the browser and deploy tests reach none of it.
pytest_add_cli_args_test_selection = [
    "tests/unit/domain",
    "tests/unit/application",
    "tests/unit/test_cli.py",
    "tests/acceptance",
]
